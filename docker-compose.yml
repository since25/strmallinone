services:
  backend:
    build:
      context: .
      dockerfile: backend_py/Dockerfile
    container_name: strmallinone-backend
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:8080
      DATABASE_PATH: /data/backend/app.db
      STRM_SAVE_DIR: /data/strm
    volumes:
      - ./backend_py/data:/data/backend
      - ./strm_output:/data/strm
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: strmallinone-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
